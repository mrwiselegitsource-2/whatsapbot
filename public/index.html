<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WhatsApp AI</title>
<style>
  :root{--bg:#eef1f4;--card:#fff;--ink:#1b2430;--mute:#5d6b7a;--line:#d6dce3;--acc:#1f6f5c;--bad:#b4472f}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:680px;margin:0 auto;padding:12px}
  h1{font-size:1.2rem;margin:4px 0 10px}
  h2{font-size:.98rem;margin:0 0 6px}
  section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
  input,textarea{width:100%;font:inherit;color:inherit;background:#fff;border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:.9rem}
  textarea{min-height:60px;resize:vertical}
  label{display:block;font-size:.82rem;color:var(--mute);margin:7px 0 3px}
  button{font:inherit;border:0;border-radius:7px;padding:7px 12px;background:var(--acc);color:#fff;cursor:pointer;font-size:.88rem}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  button.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
  button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .grow{flex:1;min-width:120px}
  .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.82rem;background:#e3e8ee}
  .pill.ok{background:#d5ecdf;color:#15523f}.pill.warn{background:#f6e0d8;color:var(--bad)}
  .code{font:700 1.8rem/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;margin:8px 0}
  .muted{color:var(--mute);font-size:.85rem}
  /* Chat rows — compact accordion */
  .chat{border-top:1px solid var(--line);padding:0}
  .chat:first-of-type{border-top:0}
  .chat summary{
    display:flex;gap:8px;align-items:center;
    cursor:pointer;list-style:none;
    padding:9px 4px;
    user-select:none;
  }
  .chat summary::-webkit-details-marker{display:none}
  .chat summary::before{content:'▶';font-size:.7rem;color:var(--mute);transition:transform .2s;flex-shrink:0}
  .chat[open] summary::before{transform:rotate(90deg)}
  .chat .name{flex:1;font-weight:600;overflow-wrap:anywhere;font-size:.93rem}
  .chat .badge{font-size:.78rem;padding:1px 7px;border-radius:99px;background:#e3e8ee;color:var(--mute)}
  .chat .badge.on{background:#d5ecdf;color:#15523f}
  .chat .body{padding:4px 4px 10px;border-top:1px solid var(--line)}
  .on{color:var(--acc)}
  #base-wrap summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;font-size:.93rem;font-weight:600}
  #base-wrap summary::-webkit-details-marker{display:none}
  #base-wrap summary::before{content:'▶';font-size:.7rem;color:var(--mute);transition:transform .2s}
  #base-wrap[open] summary::before{transform:rotate(90deg)}
  #toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 15px;border-radius:8px;display:none;font-size:.9rem}
</style>
</head>
<body>
<main>
  <h1>WhatsApp AI</h1>

  <section id="conn"></section>

  <section>
    <details id="base-wrap">
      <summary>Default reply behavior <span class="muted" id="budget" style="font-weight:400"></span></summary>
      <div style="margin-top:8px">
        <textarea id="base" rows="5"></textarea>
        <div class="row" style="margin-top:7px">
          <button id="saveBase">Save</button>
        </div>
      </div>
    </details>
  </section>

  <section>
    <h2>Chats</h2>
    <p class="muted">Turn on only the chats you want the AI to reply in. It starts remembering a chat once you turn it on.</p>
    <div class="row" style="margin-bottom:6px">
      <input id="q" class="grow" placeholder="Search chats">
      <label style="margin:0;display:flex;gap:6px;align-items:center"><input id="onlyOn" type="checkbox" style="width:auto"> Enabled only</label>
    </div>
    <div id="chats"></div>
  </section>
</main>
<div id="toast"></div>

<script>
let PASS = localStorage.getItem('pass') || '';
let STATE = null;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(t){const el=$('#toast');el.textContent=t;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',2200)}

async function api(path, body) {
  const r = await fetch('/api/' + path, {
    method: body ? 'POST' : 'GET',
    headers: { 'x-pass': PASS, 'content-type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status === 401) {
    const p = prompt('Dashboard password');
    if (p === null) throw new Error('Password needed');
    PASS = p; localStorage.setItem('pass', p);
    return api(path, body);
  }
  return r.json();
}

function renderConn() {
  const s = STATE.status;
  const el = $('#conn');
  const keep = el.querySelector('#phone')?.value || '';
  const keepCode = el.querySelector('#codeBox')?.innerHTML || '';
  let html = '<h2>WhatsApp connection</h2>';
  if (s.state === 'open') {
    html += `<span class="pill ok">Linked${s.me ? ' · +' + esc(s.me) : ''}</span>
      <div style="margin-top:10px"><button class="danger" id="logout">Unlink WhatsApp</button></div>`;
  } else if (s.state === 'needs_pairing') {
    html += `<span class="pill warn">Not linked</span>
      <label for="phone">Your WhatsApp number with country code (no + or spaces)</label>
      <div class="row"><input id="phone" class="grow" inputmode="numeric" placeholder="233XXXXXXXXX" value="${esc(keep)}"><button id="pair">Get pairing code</button></div>
      <div id="codeBox">${keepCode}</div>
      <p class="muted">Then on your phone: WhatsApp → Linked devices → Link a device → Link with phone number instead, and type the code.</p>`;
  } else {
    html += `<span class="pill">${esc(s.state)}</span>`;
  }
  if (s.error) html += `<p class="muted" style="color:var(--bad)">Last error: ${esc(s.error)}</p>`;
  el.innerHTML = html;
  $('#logout')?.addEventListener('click', async () => { if (confirm('Unlink this WhatsApp?')) { await api('logout', {}); toast('Unlinked'); } });
  $('#pair')?.addEventListener('click', async () => {
    const r = await api('pair', { phone: $('#phone').value });
    $('#codeBox').innerHTML = r.code
      ? `<div class="code">${esc(r.code.slice(0,4))}-${esc(r.code.slice(4))}</div>`
      : `<p style="color:var(--bad)">${esc(r.error)}</p>`;
  });
}

function renderChats() {
  const q = $('#q').value.toLowerCase();
  const only = $('#onlyOn').checked;
  const list = STATE.chats.filter((c) => (!only || c.enabled) && (c.name + c.jid).toLowerCase().includes(q)).slice(0, 80);
  $('#chats').innerHTML = list.length ? list.map((c) => `
    <details class="chat" data-jid="${esc(c.jid)}">
      <summary>
        <span class="name">${esc(c.name)}<span class="muted" style="font-weight:400;font-size:.8rem"> ${c.group ? '· group' : '· chat'}</span></span>
        <span class="badge${c.enabled ? ' on' : ''}">${c.enabled ? '✓ AI on' : 'off'}</span>
      </summary>
      <div class="body">
        <label style="display:flex;gap:8px;align-items:center;margin:6px 0 8px"><input type="checkbox" class="en" style="width:auto"${c.enabled ? ' checked' : ''}> <b>Reply in this chat</b></label>
        <label>How to reply here (optional)</label>
        <textarea class="pr" rows="2" placeholder="e.g. Be polite, answer in Pidgin or English.">${esc(c.prompt)}</textarea>
        <label>Trigger word — only reply when message contains (leave blank = reply to all)</label>
        <input class="tr" value="${esc(c.trigger)}" placeholder="Leave blank to reply to every message">
        <label>Style notes / sample messages (optional)</label>
        <textarea class="no" rows="2" placeholder="Paste a few real messages so it copies your style.">${esc(c.notes)}</textarea>
        <div class="row" style="margin-top:8px">
          <button class="save">Save</button>
          <button class="ghost forget">Clear memory</button>
          <span class="muted">${c.remembered} msgs</span>
        </div>
      </div>
    </details>`).join('') : '<p class="muted">No chats yet.</p>';
}

$('#chats').addEventListener('click', async (e) => {
  const box = e.target.closest('.chat'); if (!box) return;
  const jid = box.dataset.jid;
  if (e.target.classList.contains('save')) {
    await api('chat', { jid, enabled: box.querySelector('.en').checked, prompt: box.querySelector('.pr').value, trigger: box.querySelector('.tr').value, notes: box.querySelector('.no').value });
    toast('Saved'); await load(true);
  }
  if (e.target.classList.contains('forget') && confirm('Clear what the AI remembers about this chat?')) {
    await api('chat/forget', { jid }); toast('Memory cleared'); await load(true);
  }
});
$('#q').addEventListener('input', () => STATE && renderChats());
$('#onlyOn').addEventListener('change', () => STATE && renderChats());
$('#saveBase').addEventListener('click', async () => { await api('settings', { basePrompt: $('#base').value }); toast('Saved'); });

async function load(withChats) {
  STATE = await api('state');
  renderConn();
  $('#budget').textContent = `${STATE.repliesLastHour}/${STATE.maxPerHour} replies this hour`;
  if (withChats === true || !$('#chats').children.length) { $('#base').value = STATE.basePrompt; renderChats(); }
}
load(true);
setInterval(() => { if (STATE) load(false).catch(() => {}); }, 6000);
</script>
</body>
</html>
